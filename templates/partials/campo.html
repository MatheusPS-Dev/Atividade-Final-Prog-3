{% comment %}Um campo de formulário: rótulo acima, ajuda e erros ligados ao campo.{% endcomment %}
<div class="campo{% if campo.errors %} campo--erro{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.help_text %}<div class="campo__ajuda" id="{{ campo.auto_id }}_helptext">{{ campo.help_text|safe }}</div>{% endif %}
  {% for erro in campo.errors %}<p class="campo__erro">{{ erro }}</p>{% endfor %}
</div>
